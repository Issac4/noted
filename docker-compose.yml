services:
  db:
    image: postgres:16-alpine
    container_name: todo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo_admin
      POSTGRES_PASSWORD: todo_password
      POSTGRES_DB: family_todo
    command: ["postgres", "-c", "synchronous_commit=on"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_admin -d family_todo"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://todo_admin:todo_password@db:5432/family_todo
      AUTO_MIGRATE: "true"
      APP_PASSCODE: ${APP_PASSCODE:-}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
